name: Frontend Dependency Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select the verified package manager
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Install the immutable dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit the complete dependency tree
        run: npm audit
      - name: Lint all frontend source
        run: npm run lint
      - name: Existing security boundary contracts
        run: npm run test:security
      - name: Production build
        run: npm run build
      - name: Install the verified Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Production routes and interactive browser contracts
        run: npm run test:e2e
